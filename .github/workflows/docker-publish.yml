name: docker-publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lemon-manuals-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
      # Build locally and boot it before pushing: /healthz only returns 200
      # after both index files parse, so this catches runtime breakage.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: lemon-manuals-mcp-smoke:amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          mkdir -p /tmp/smoke
          echo '{"database":"lemon","vehicles":[{"make":"Honda","years":["2019"],"model":"Civic","engine":"EX","uriPath":"/Honda/2019/Civic%20EX/","isComplete":true}]}' > /tmp/smoke/lemon-index.json
          echo '{"database":"charm","vehicles":[]}' > /tmp/smoke/charm-index.json
          cid=$(docker run -d -p 8787:8787 -v /tmp/smoke:/data-test \
            -e LEMON_INDEX_JSON=/data-test/lemon-index.json \
            -e CHARM_INDEX_JSON=/data-test/charm-index.json \
            lemon-manuals-mcp-smoke:amd64)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "server never became healthy"; docker logs "$cid"; exit 1
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
